services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:18
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_DB: gov_check_db
      POSTGRES_USER: govcheck_user
      POSTGRES_PASSWORD: gov_check_pw
      TZ: Europe/Stockholm
      PGTZ: Europe/Stockholm
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres:
